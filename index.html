<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRESH'UP Drinks — Quiz de la Direction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
  :root{
    --cream:#FBF6EA;
    --cream-deep:#F2ECDA;
    --teal:#0E6E68;
    --teal-deep:#0A4F4B;
    --lime:#C7E24E;
    --coral:#FF7A4D;
    --coral-deep:#E15E33;
    --navy:#152C2A;
    --paper:#FFFFFF;
    --ok:#3E9A5C;
    --bad:#D8534B;
    --radius:22px;
    /* active service accent, swapped by JS */
    --accent:#0E6E68;
    --accent-deep:#0A4F4B;
    --accent-soft:#0E6E6822;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#141C1A;
      --cream-deep:#0E1614;
      --paper:#1D2825;
      --navy:#F1F4E9;
    }
  }
  :root[data-theme="dark"]{
    --cream:#141C1A;
    --cream-deep:#0E1614;
    --paper:#1D2825;
    --navy:#F1F4E9;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--cream);
    color:var(--navy);
    font-family:'Work Sans', system-ui, 'Segoe UI', Arial, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 70px;
    position:relative;
    overflow-x:hidden;
    transition: background .5s ease;
  }

  /* floating bubbles background */
  .bubbles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
  }
  .bubble{
    position:absolute;
    bottom:-10%;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, var(--accent-soft), transparent 70%);
    border:1.5px solid var(--accent-soft);
    animation: rise linear infinite;
    opacity:0.55;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0) scale(1); opacity:0; }
    10%{ opacity:0.5; }
    100%{ transform:translateY(-115vh) translateX(var(--drift,20px)) scale(1.15); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .bubble{animation:none; display:none;}
  }

  .app{
    width:100%;
    max-width:640px;
    position:relative;
    z-index:1;
  }

  .brandbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .bottle{
    width:32px;height:32px;
    display:block;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.12));
  }
  .brand span{
    font-family:'Baloo 2', 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    font-weight:800;
    font-size:1.2rem;
    letter-spacing:0.2px;
    color:var(--teal-deep);
  }
  .tag{
    font-size:0.72rem;
    font-weight:700;
    background:var(--navy);
    color:var(--cream);
    padding:6px 12px;
    border-radius:100px;
    opacity:0.9;
    font-family:'Baloo 2', 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    transition: transform .2s ease;
  }
  .tag.bump{ animation: bump .35s ease; }
  @keyframes bump{ 0%{transform:scale(1);} 40%{transform:scale(1.18);} 100%{transform:scale(1);} }

  /* route with icons per service */
  .route{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  .stop{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .stop .ring{
    width:34px;height:34px;
    border-radius:50%;
    background:var(--paper);
    border:2.5px solid rgba(21,44,42,0.14);
    display:flex;align-items:center;justify-content:center;
    font-size:1rem;
    transition: all .25s ease;
  }
  .stop .bar{
    width:100%;
    height:5px;
    border-radius:4px;
    background:rgba(21,44,42,0.1);
  }
  .stop.done .ring{ border-color:var(--accent); background:var(--accent); }
  .stop.done .bar{ background:var(--accent); }
  .stop.current .ring{
    border-color:var(--accent-deep);
    box-shadow:0 0 0 4px var(--accent-soft);
    transform:scale(1.08);
  }
  .stop.current .bar{ background:var(--accent); }

  .service-label{
    font-size:0.86rem;
    font-weight:700;
    color:var(--accent-deep);
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Baloo 2', 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    transition: color .3s ease;
  }
  .service-label .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--accent);
    flex:none;
  }

  .card{
    background:var(--paper);
    border-radius:var(--radius);
    padding:32px 28px 26px;
    box-shadow: 0 1px 2px rgba(20,40,35,0.05), 0 20px 44px -18px rgba(20,40,35,0.28);
    border:1px solid rgba(20,40,35,0.06);
    border-top:5px solid var(--accent);
    animation: cardIn .38s cubic-bezier(.2,.8,.2,1);
    transition: border-color .3s ease;
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .card{animation:none;}
  }

  h1{
    font-family:'Baloo 2', 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    font-size:2.1rem;
    line-height:1.12;
    margin:0 0 10px;
    color:var(--teal-deep);
  }
  .lead{
    font-size:1.02rem;
    line-height:1.6;
    color:var(--navy);
    opacity:0.85;
    margin:0 0 22px;
  }

  .qcount{
    font-size:0.82rem;
    font-weight:700;
    color:var(--accent);
    margin-bottom:8px;
    letter-spacing:0.2px;
  }
  .question{
    font-family:'Baloo 2', 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    font-weight:600;
    font-size:1.34rem;
    line-height:1.32;
    margin:0 0 22px;
    color:var(--navy);
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:11px;
    margin-bottom:6px;
  }
  .opt{
    text-align:left;
    border:2px solid rgba(20,40,35,0.12);
    background:var(--cream-deep);
    color:var(--navy);
    border-radius:15px;
    padding:14px 18px;
    font-family:'Work Sans', sans-serif;
    font-size:1rem;
    font-weight:500;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .12s ease, box-shadow .15s ease;
    line-height:1.4;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .opt .letter{
    width:26px;height:26px;
    border-radius:8px;
    background:rgba(21,44,42,0.08);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;
    font-size:0.85rem;
    flex:none;
    transition: all .15s ease;
  }
  .opt:hover:not(:disabled){
    border-color:var(--accent);
    transform:translateY(-2px);
    box-shadow:0 8px 16px -10px var(--accent-soft);
  }
  .opt:hover:not(:disabled) .letter{ background:var(--accent-soft); }
  .opt:disabled{cursor:default;}
  .opt.correct{
    border-color:var(--ok);
    background:rgba(62,154,92,0.14);
    animation: pop .3s ease;
  }
  .opt.correct .letter{ background:var(--ok); color:#fff; }
  .opt.wrong{
    border-color:var(--bad);
    background:rgba(216,83,75,0.12);
    animation: shake .35s ease;
  }
  .opt.wrong .letter{ background:var(--bad); color:#fff; }
  .opt.reveal-correct{
    border-color:var(--ok);
    background:rgba(62,154,92,0.14);
  }
  .opt.reveal-correct .letter{ background:var(--ok); color:#fff; }
  @keyframes pop{
    0%{ transform:scale(1); } 45%{ transform:scale(1.02); } 100%{ transform:scale(1); }
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px); }
    75%{ transform:translateX(4px); }
  }
  @media (prefers-reduced-motion: reduce){
    .opt.correct, .opt.wrong{ animation:none; }
  }

  .feedback{
    margin-top:16px;
    padding:15px 17px;
    border-radius:15px;
    font-size:0.94rem;
    line-height:1.55;
    display:none;
    align-items:flex-start;
    gap:10px;
  }
  .feedback.show{display:flex; animation: fadeUp .3s ease;}
  @keyframes fadeUp{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  .feedback.ok{background:rgba(62,154,92,0.12); color:#276A3E;}
  .feedback.bad{background:rgba(216,83,75,0.1); color:#A3352E;}
  @media (prefers-color-scheme: dark){
    .feedback.ok{color:#9BE0AE;}
    .feedback.bad{color:#F0A29C;}
  }
  .feedback .ico{ font-size:1.15rem; line-height:1; flex:none; }

  .actions{
    display:flex;
    justify-content:flex-end;
    margin-top:22px;
  }
  .btn{
    font-family:'Baloo 2', 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    font-weight:700;
    font-size:1rem;
    color:var(--cream);
    background:var(--accent);
    border:none;
    border-radius:100px;
    padding:13px 28px;
    cursor:pointer;
    transition:background .15s ease, transform .12s ease, box-shadow .15s ease;
    box-shadow: 0 10px 20px -10px var(--accent-soft);
  }
  .btn:hover:not(:disabled){ background:var(--accent-deep); transform:translateY(-2px); }
  .btn:active:not(:disabled){ transform:translateY(0); }
  .btn:disabled{opacity:0.35; cursor:not-allowed; transform:none; box-shadow:none;}
  .btn.coral{background:var(--coral); box-shadow:0 10px 20px -10px rgba(255,122,77,0.5);}
  .btn.coral:hover{background:var(--coral-deep);}
  .btn.ghost{
    background:transparent;
    color:var(--accent-deep);
    border:2px solid var(--accent);
    padding:11px 26px;
    box-shadow:none;
  }
  .btn.ghost:hover{background:var(--accent-soft);}

  /* Intro screen */
  .intro .hero{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:6px;
  }
  .intro .hero svg{ width:96px; height:96px; animation: floatY 3.2s ease-in-out infinite; }
  @keyframes floatY{
    0%,100%{ transform:translateY(0) rotate(-2deg); }
    50%{ transform:translateY(-8px) rotate(2deg); }
  }
  @media (prefers-reduced-motion: reduce){ .intro .hero svg{animation:none;} }

  .intro h1{ text-align:center; }
  .intro .lead{ text-align:center; }

  .services{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin:22px 0 28px;
  }
  .svc{
    background:var(--cream-deep);
    border-radius:15px;
    padding:13px 14px;
    font-size:0.86rem;
    font-weight:700;
    color:var(--navy);
    display:flex;
    align-items:center;
    gap:10px;
    border-left:4px solid var(--svc-color, var(--teal));
    font-family:'Baloo 2', 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
  }
  .svc .ico{ font-size:1.2rem; flex:none; }

  .intro .actions{ justify-content:center; }

  /* Results screen */
  .results{ text-align:center; }
  .results .trophy{
    font-size:3rem;
    margin-bottom:6px;
    display:block;
    animation: bounceIn .5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes bounceIn{
    0%{ transform:scale(0.4); opacity:0; }
    60%{ transform:scale(1.1); opacity:1; }
    100%{ transform:scale(1); }
  }
  .results .badge{
    display:inline-block;
    font-family:'Baloo 2', 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    font-weight:700;
    font-size:0.9rem;
    padding:7px 16px;
    border-radius:100px;
    background:var(--lime);
    color:var(--teal-deep);
    margin-bottom:14px;
  }
  .score-big{
    font-family:'Baloo 2', 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    font-weight:800;
    font-size:3.4rem;
    color:var(--teal-deep);
    margin:0 0 2px;
  }
  .score-sub{
    font-size:0.94rem;
    color:var(--navy);
    opacity:0.78;
    margin-bottom:24px;
  }
  .breakdown{
    display:flex;
    flex-direction:column;
    gap:11px;
    margin-bottom:26px;
    text-align:left;
  }
  .bd-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .bd-row .ico{ font-size:1.05rem; flex:none; width:20px; text-align:center; }
  .bd-label{
    width:140px;
    font-size:0.83rem;
    font-weight:600;
    color:var(--navy);
    flex:none;
  }
  .bd-bar{
    flex:1;
    height:11px;
    border-radius:6px;
    background:rgba(20,40,35,0.08);
    overflow:hidden;
  }
  .bd-fill{
    height:100%;
    border-radius:6px;
    background:var(--ok);
    width:0;
    transition:width .8s cubic-bezier(.2,.8,.2,1);
  }
  .bd-fill.low{background:var(--bad);}
  .bd-fill.mid{background:var(--coral);}
  .bd-val{
    width:42px;
    text-align:right;
    font-size:0.8rem;
    font-weight:700;
    color:var(--navy);
    opacity:0.75;
    flex:none;
  }

  .result-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }


  .logo-tile{ background:#fff; border-radius:50%; display:block; object-fit:cover; box-shadow:0 2px 6px rgba(0,0,0,0.12); }
  .brand .logo-tile{ width:38px; height:38px; }
  .intro .hero .logo-tile{ width:150px; height:150px; animation: floatY 3.2s ease-in-out infinite; box-shadow:0 12px 28px -12px rgba(14,110,104,0.45); }
  .author{ text-align:center; font-family:'Baloo 2', 'Trebuchet MS', 'Segoe UI', Arial, sans-serif; font-weight:600; font-size:1rem; color:var(--teal-deep); margin:-8px 0 18px; }
  .author b{ font-weight:800; }
  @media (prefers-reduced-motion: reduce){ .intro .hero .logo-tile{animation:none;} }
  @media (max-width:480px){ .intro .hero .logo-tile{width:120px;height:120px;} }


  .progress{ height:8px; border-radius:6px; background:rgba(21,44,42,0.1); overflow:hidden; margin:-6px 0 20px; }
  .progress i{ display:block; height:100%; background:var(--accent); border-radius:6px; transition:width .5s cubic-bezier(.2,.8,.2,1); }
  .streak{ display:inline-block; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.82rem; color:#fff; background:linear-gradient(135deg,#FF9F43,#FF5E3A); padding:4px 12px; border-radius:100px; margin-left:8px; animation: bump .4s ease; }
  .name-field{ display:block; margin:0 auto 22px; max-width:320px; }
  .name-field label{ display:block; font-size:.85rem; font-weight:600; color:var(--teal-deep); margin-bottom:6px; text-align:center; }
  .name-field input{ width:100%; padding:12px 16px; border-radius:100px; border:2px solid rgba(20,40,35,.15); background:var(--cream-deep); color:var(--navy); font-family:'Work Sans',sans-serif; font-size:1rem; text-align:center; }
  .name-field input:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 4px rgba(14,110,104,.15); }
  .note-wrap{ display:inline-flex; align-items:baseline; gap:4px; margin:2px 0 4px; }
  .note-wrap .note{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:4.6rem; line-height:1; color:var(--teal-deep); }
  .note-wrap .sur{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.6rem; color:var(--coral-deep); }
  .player{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.15rem; color:var(--teal-deep); margin:0 0 6px; }
  .stars{ font-size:1.8rem; letter-spacing:6px; margin-bottom:8px; }
  .stars span{ opacity:.18; filter:grayscale(1); transition:all .4s ease; }
  .stars span.on{ opacity:1; filter:none; }
  .meta{ font-size:.8rem; opacity:.6; margin-bottom:18px; }
  .review{ text-align:left; margin:0 0 24px; }
  .review summary{ cursor:pointer; font-family:'Baloo 2',sans-serif; font-weight:700; color:var(--accent-deep); padding:10px 0; }
  .rev-item{ background:var(--cream-deep); border-left:4px solid var(--bad); border-radius:12px; padding:12px 14px; margin-bottom:10px; font-size:.88rem; line-height:1.5; }
  .rev-item b{ display:block; margin-bottom:4px; }
  .rev-item .good{ color:#276A3E; font-weight:600; }
  @media (prefers-color-scheme: dark){ .rev-item .good{ color:#9BE0AE; } }
  .perfect{ text-align:center; padding:12px; font-weight:600; }
  @media (max-width:480px){ .note-wrap .note{ font-size:3.6rem; } }

  #confetti{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
  }

  @media (max-width:480px){
    .card{padding:26px 18px 22px;}
    h1{font-size:1.6rem;}
    .question{font-size:1.15rem;}
    .services{grid-template-columns:1fr;}
    .bd-label{width:110px; font-size:0.75rem;}
    .intro .hero svg{width:76px; height:76px;}
  }
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<canvas id="confetti"></canvas>
<div class="app" id="app"></div>

<script>
/* ---------- Data ---------- */
const SERVICES = [
  {id:"innovation", label:"Service Innovation", icon:"💡", color:"#6FA83A"},
  {id:"marketing", label:"Service Marketing", icon:"📈", color:"#2E6FB0"},
  {id:"commercial", label:"Service Commercial", icon:"🛒", color:"#E1782B"},
  {id:"relation", label:"Service Relation Client", icon:"🎧", color:"#8A4FBF"},
  {id:"qualite", label:"Service Qualité", icon:"📋", color:"#C79A1E"},
  {id:"direction", label:"Réunion de la Direction", icon:"🏆", color:"#0E6E68"},
];

function accentOf(id){
  const s = SERVICES.find(s => s.id === id);
  return s ? s.color : "#0E6E68";
}
function hexToRgba(hex, a){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
function setAccent(hex){
  document.documentElement.style.setProperty('--accent', hex);
  document.documentElement.style.setProperty('--accent-deep', hex);
  document.documentElement.style.setProperty('--accent-soft', hexToRgba(hex, 0.16));
}

const QUESTIONS = [
  {
    service:"innovation",
    q:"Avant d'imaginer votre boisson, quelle est la première chose à définir ?",
    options:[
      "Le budget publicitaire de l'entreprise",
      "La clientèle cible, le goût et l'identité du produit",
      "Le nom du responsable des ventes",
      "Le nombre d'équipes concurrentes"
    ],
    correct:1,
    exp:"On part toujours du client : à qui s'adresse la boisson, quel goût, puis son identité (nom, slogan, couleurs)."
  },
  {
    service:"innovation",
    q:"Selon la ressource « Imaginer une boisson qui plaît aux consommateurs », un bon packaging doit être :",
    options:[
      "Identique à celui des concurrents",
      "Le moins cher possible à produire",
      "Attractif, facile à reconnaître et en lien avec le produit",
      "Uniquement transparent"
    ],
    correct:2,
    exp:"Le packaging doit être attractif, facile à reconnaître, adapté aux jeunes et cohérent avec le produit."
  },
  {
    service:"innovation",
    q:"Quel est l'objectif exact confié au Service Innovation ?",
    options:[
      "Fixer le prix de vente final du produit",
      "Concevoir une nouvelle boisson en définissant son identité, son positionnement et son univers visuel",
      "Gérer les réclamations des premiers clients",
      "Choisir les lieux de distribution du produit"
    ],
    correct:1,
    exp:"Le dossier de mission N°1 fixe cet objectif : concevoir une boisson qui répond aux attentes de la cible, avec une identité et un univers visuel cohérents."
  },
  {
    service:"innovation",
    q:"Avant de rendre son travail, la check-list du Service Innovation demande de vérifier que :",
    options:[
      "Le nom est original, le goût correspond à la clientèle, le packaging attire le regard et le slogan donne envie d'acheter",
      "Le produit coûte le moins cher possible à fabriquer",
      "Le logo utilise uniquement les couleurs de la concurrence",
      "Le produit ne contient aucun ingrédient naturel"
    ],
    correct:0,
    exp:"La ressource « Imaginer une boisson » liste ces quatre points de vérification avant de rendre le travail."
  },
  {
    service:"innovation",
    q:"Qui est la responsable du Service Innovation chez Fresh'Up Drinks ?",
    options:[
      "Sarah Morel",
      "Julie Leroy",
      "Léa Martin",
      "Thomas Durand"
    ],
    correct:2,
    exp:"Léa Martin, Directrice innovation, est la responsable de service indiquée dans le dossier de mission N°1."
  },
  {
    service:"marketing",
    q:"Que désignent les « 4P » du plan de marchéage ?",

let current = 0;

function resetScores(){
  SERVICES.forEach(s => serviceScores[s.id] = {correct:0, total:0});
  QUESTIONS.forEach(q => serviceScores[q.service].total++);
}
resetScores();

const app = document.getElementById('app');

/* ---------- Floating bubbles ---------- */
function spawnBubbles(){
  const holder = document.getElementById('bubbles');
  holder.innerHTML = "";
  const n = window.innerWidth < 500 ? 8 : 14;
  for (let i=0;i<n;i++){
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 14 + Math.random()*46;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = (Math.random()*100) + 'vw';
    b.style.setProperty('--drift', (Math.random()*60 - 30) + 'px');
    const dur = 9 + Math.random()*10;
    b.style.animationDuration = dur + 's';
    b.style.animationDelay = (-Math.random()*dur) + 's';
    holder.appendChild(b);
  }
}
spawnBubbles();
window.addEventListener('resize', spawnBubbles);

/* ---------- Confetti ---------- */
function fireConfetti(){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#C7E24E','#FF7A4D','#0E6E68','#2E6FB0','#8A4FBF','#C79A1E'];
  const pieces = Array.from({length:90}, () => ({
    x: canvas.width/2 + (Math.random()-0.5)*200,
    y: canvas.height*0.25,
    vx: (Math.random()-0.5)*9,
    vy: -Math.random()*9 - 4,
    size: 5 + Math.random()*6,
    color: colors[Math.floor(Math.random()*colors.length)],
    rot: Math.random()*360,
    vr: (Math.random()-0.5)*14,
    life: 0
  }));
  let frame = 0;
  function tick(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    pieces.forEach(p => {
      p.vy += 0.22;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life++;
      if (p.y < canvas.height + 20) alive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
      ctx.restore();
    });
    if (alive && frame < 260){
      requestAnimationFrame(tick);
    } else {
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }
  tick();
}

/* ---------- Render helpers ---------- */
function serviceLabel(id){ return SERVICES.find(s => s.id === id)?.label || id; }
function serviceIcon(id){ return SERVICES.find(s => s.id === id)?.icon || "•"; }

function renderRoute(){
  const idx = SERVICES.findIndex(s => s.id === QUESTIONS[current]?.service);
  return `<div class="route">` + SERVICES.map((s,i) => {
    let cls = "stop";
    if (i < idx) cls += " done";
    if (i === idx) cls += " current";
    return `<div class="${cls}"><div class="ring">${i < idx ? "✓" : s.icon}</div><div class="bar"></div></div>`;
  }).join("") + `</div>`;
}

function renderQuestion(){
  answered = false;
  const q = QUESTIONS[current];
  const accent = accentOf(q.service);
  setAccent(accent);

  app.innerHTML = `
    <div class="brandbar">
      <div class="brand">
        ${bottleIcon(accent)}
        <span>FRESH'UP DRINKS</span>
      </div>
      <div class="tag" id="scoreTag">Score : ${score}/${QUESTIONS.length}</div>
    </div>
    ${renderRoute()}
    <div class="progress"><i style="width:${(current/QUESTIONS.length)*100}%"></i></div>
    <div class="service-label"><span class="dot"></span>${serviceIcon(q.service)} ${serviceLabel(q.service)}</div>
    <div class="card">
      <div class="qcount">Question ${current + 1} sur ${QUESTIONS.length}</div>
      <p class="question">${q.q}</p>
      <div class="options" id="options">
        ${q.options.map((opt, i) => `<button class="opt" data-i="${i}"><span class="letter">${LETTERS[i]}</span><span>${opt}</span></button>`).join("")}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button class="btn" id="nextBtn" disabled>${current === QUESTIONS.length - 1 ? "Voir mon résultat 🏁" : "Question suivante →"}</button>
      </div>
    </div>
  `;

  const optButtons = Array.from(document.querySelectorAll('.opt'));
  optButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      const i = Number(btn.dataset.i);
      const correct = q.correct;
      optButtons.forEach(b => b.disabled = true);

      if (i === correct){
        btn.classList.add('correct');
        score++; streak++;
        serviceScores[q.service].correct++;
      } else {
        btn.classList.add('wrong');
        optButtons[correct].classList.add('reveal-correct');
        streak = 0;
        wrongList.push({q:q.q, good:q.options[correct], exp:q.exp, service:q.service});
      }

      const fb = document.getElementById('feedback');
      fb.classList.add('show', i === correct ? 'ok' : 'bad');
      const okMsgs = ["Exact !","Bravo !","Bien joué !","Parfait !","Excellent !"];
      const koMsgs = ["Pas tout à fait.","Presque !","Retiens bien celle-là."];
      const msg = i === correct ? okMsgs[Math.floor(Math.random()*okMsgs.length)] : koMsgs[Math.floor(Math.random()*koMsgs.length)];
      fb.innerHTML = `<span class="ico">${i === correct ? "✅" : "💡"}</span><span><b>${msg}</b> ${q.exp}</span>`;

      document.getElementById('nextBtn').disabled = false;
      const tag = document.getElementById('scoreTag');
      tag.textContent = `Score : ${score}/${QUESTIONS.length}`;
      tag.classList.remove('bump'); void tag.offsetWidth; tag.classList.add('bump');
      const old = document.getElementById('streakTag'); if (old) old.remove();
      if (streak >= 2){ const s = document.createElement('span'); s.id='streakTag'; s.className='streak'; s.textContent = '🔥 ' + streak + ' d\'affilée'; tag.after(s); }
    });
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    if (current < QUESTIONS.length - 1){
      current++;
      renderQuestion();
    } else {
      renderResults();
    }
  });
}

function gradeFor(pct){
  if (pct >= 90) return {label:"Expert", emoji:"🏆", msg:"Votre équipe maîtrise parfaitement le projet FRESH'UP. La direction est convaincue !"};
  if (pct >= 70) return {label:"Averti", emoji:"⭐", msg:"Un très bon niveau. Quelques révisions ciblées et la soutenance sera solide."};
  if (pct >= 45) return {label:"Débrouillé", emoji:"🌱", msg:"Les bases sont là. Relisez les dossiers ressources des missions les moins réussies."};
  return {label:"Novice", emoji:"📎", msg:"C'est le moment de revoir les fiches ressources avant la présentation devant le jury."};
}

function renderResults(){
  setAccent("#0E6E68");
  const pct = Math.round((score / QUESTIONS.length) * 100);
  const grade = gradeFor(pct);
  const note20 = Math.round((score / QUESTIONS.length) * 20 * 2) / 2; // arrondi au 0,5
  const reviewHtml = wrongList.length
    ? `<details class="review"><summary>📖 Revoir mes ${wrongList.length} erreur${wrongList.length>1?'s':''}</summary>${wrongList.map(w => `<div class="rev-item"><b>${w.q}</b><span class="good">Bonne réponse : ${w.good}</span><br>${w.exp}</div>`).join("")}</details>`
    : `<div class="perfect">🎉 Aucune erreur : sans faute !</div>`;

  const rows = SERVICES.map(s => {
    const d = serviceScores[s.id];
    const p = d.total ? Math.round((d.correct / d.total) * 100) : 0;
    const fillClass = p >= 70 ? "" : (p >= 40 ? "mid" : "low");
    return `
      <div class="bd-row">
        <span class="ico">${s.icon}</span>
        <div class="bd-label">${s.label}</div>
        <div class="bd-bar"><div class="bd-fill ${fillClass}" data-w="${p}" style="width:0"></div></div>
        <div class="bd-val">${d.correct}/${d.total}</div>
      </div>
    `;
  }).join("");

  app.innerHTML = `
    <div class="brandbar">
      <div class="brand">
        ${bottleIcon("#0E6E68")}
        <span>FRESH'UP DRINKS</span>
      </div>
      <div class="tag">Terminé</div>
    </div>
    <div class="card results">
      ${playerName ? `<p class="player">${playerName.replace(/</g,'&lt;')}, voici ton résultat</p>` : ""}
      <div class="trophy">${grade.emoji}</div>
      <div class="badge">Niveau ${grade.label}</div>
      <div class="stars">${[1,2,3,4,5].map(n => `<span class="${note20 >= n*4 - 2 ? 'on':''}">⭐</span>`).join("")}</div>
      <div class="note-wrap"><span class="note" id="noteNum">0</span><span class="sur">/ 20</span></div>
      <p class="score-sub">${score} bonnes réponses sur ${QUESTIONS.length} (${pct}%) — ${grade.msg}</p>
      <p class="meta">${new Date().toLocaleDateString('fr-FR')} · Fais une capture d'écran pour la montrer à ton enseignant(e)</p>
      <div class="breakdown">${rows}</div>
      ${reviewHtml}
      <div class="result-actions">
        <button class="btn coral" id="retryBtn">Refaire le quiz</button>
      </div>
    </div>
  `;
  document.getElementById('retryBtn').addEventListener('click', renderIntro);

  // compteur animé de la note
  (function(){
    const el = document.getElementById('noteNum'); const target = note20; const t0 = performance.now(); const D = 1100;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const fmt = v => (Math.round(v*2)/2).toString().replace('.', ',');
    if (reduce){ el.textContent = fmt(target); return; }
    function step(now){ const k = Math.min(1,(now-t0)/D); const e = 1-Math.pow(1-k,3); el.textContent = fmt(target*e); if (k<1) requestAnimationFrame(step); else el.textContent = fmt(target); }
    requestAnimationFrame(step);
  })();

  requestAnimationFrame(() => {
    document.querySelectorAll('.bd-fill').forEach(el => {
      el.style.width = el.dataset.w + '%';
    });
  });

  if (pct >= 70) fireConfetti();
}

renderIntro();
</script>
</body>
</html>
